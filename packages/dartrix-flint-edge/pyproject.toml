[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dartrix-flint-edge"
version = "1.0.0"
description = "Deterministic telemetry, phase synchronization, and brine stratification edge core"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
